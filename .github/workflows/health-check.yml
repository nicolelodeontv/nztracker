name: Production Health Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check sync status
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30             https://chaoszenshintracker.vercel.app/api/sync-status > sync-status.json
          jq -e '
            (.status == "active")
            or (
              (.lastRunAt // "") != ""
              and (
                try ((.lastRunAt | fromdateiso8601) >= (now - 900))
                catch false
              )
            )
          ' sync-status.json > /dev/null
          echo "sync-status healthy"

      - name: Check dashboard
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30             https://chaoszenshintracker.vercel.app/api/dashboard > dashboard.json
          jq -e '.configured == true' dashboard.json > /dev/null
          echo "dashboard configured"

      - name: Check monitor health
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is required for monitor health check." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://chaoszenshintracker.vercel.app/api/monitor-health > monitor-health.json
          jq -e '.ok == true and .healthy == true and (.problems | length) == 0' monitor-health.json >/dev/null
          echo "monitor health healthy"
