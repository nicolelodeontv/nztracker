name: Ninja Zenshin Monitor Backup

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run monitor backup
        env:
          TRACKER_URL: https://chaoszenshintracker.vercel.app/api/monitor
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          echo "Running Ninja Zenshin monitor backup: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -z "$CRON_SECRET" ]; then
            echo "GitHub Actions secret CRON_SECRET is not configured." >&2
            exit 1
          fi
          set +e
          http_code="$(curl --silent --show-error --max-time 240 -o response.json -w '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'User-Agent: NinjaZenshinGitHubMonitorBackup/1.0' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$TRACKER_URL")"
          curl_exit=$?
          set -e
          echo "HTTP $http_code"
          cat response.json
          if [ "$curl_exit" -ne 0 ]; then
            echo "curl failed with exit code $curl_exit" >&2
            exit "$curl_exit"
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "monitor returned HTTP $http_code" >&2
            exit 1
          fi
          jq -e '(.ok == true) and (.status == "success" or .status == "skipped")' response.json >/dev/null
