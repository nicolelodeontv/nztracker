name: Ninja Zenshin Supabase Sync (5m)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Supabase clan sync
        env:
          TRACKER_URL: https://nztracker.vercel.app/api/sync-clans
        run: |
          set -euo pipefail
          echo "Running Ninja Zenshin Supabase sync: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          response="$(curl --fail --silent --show-error --max-time 55 \
            -H 'Accept: application/json' \
            -H 'User-Agent: NinjaZenshinGitHubSync/1.0' \
            "$TRACKER_URL")"
          echo "$response"
