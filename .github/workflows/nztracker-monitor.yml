name: Ninja Zenshin Full Sync (scheduled + manual)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run full multi-source sync
        env:
          TRACKER_URL: https://chaoszenshintracker.vercel.app/api/sync-all
        run: |
          set -euo pipefail
          echo "Running Ninja Zenshin full sync: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          response="$(curl --fail --silent --show-error --max-time 240             -H 'Accept: application/json'             -H 'User-Agent: NinjaZenshinGitHubSync/7.0'             "$TRACKER_URL")"
          echo "$response"
          echo "$response" | jq -e '(.membersSeen // 0) > 0' >/dev/null
