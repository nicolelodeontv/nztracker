name: AMF Preview Validation

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_rx6g4OQD04E4zewjHyifD7xh
      VERCEL_PROJECT_ID: prj_QLVtFPim28aj0XbOQEkCD0I8tAHn
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Deploy Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      - name: Inspect game client AMF contract
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.preview_url }}"
          RESPONSE="$(curl --fail --silent --show-error --max-time 20 "$URL/api/amf-discovery")"
          echo "$RESPONSE" | jq .

      - name: Probe AMF without persistence
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          URL="${{ steps.deploy.outputs.preview_url }}"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT

          set +e
          HTTP_STATUS="$(curl --silent --show-error --max-time 20             -o "$BODY_FILE"             -w '%{http_code}'             -H "Authorization: Bearer $CRON_SECRET"             "$URL/api/amf-probe?clanId=3")"
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error title=AMF Preview Validation::AMF probe transport failed (curl exit $CURL_EXIT)."
            exit "$CURL_EXIT"
          fi

          RESPONSE="$(cat "$BODY_FILE")"
          echo "$RESPONSE" | jq .
          STATUS="$(jq -r '.status // empty' <<< "$RESPONSE")"

          case "$STATUS" in
            success)
              jq -e '
                .ok == true
                and .source == "amf"
                and (.count // 0) > 0
                and .status == "success"
                and .diagnostics.status == "success"
                and (.diagnostics.httpStatus // 0) == 200
                and "'"$HTTP_STATUS"'" == "200"
              ' <<< "$RESPONSE" >/dev/null
              echo "AMF: success, live member data returned."
              ;;
            known_unauthorized)
              jq -e '
                .ok == true
                and .source == "amf"
                and .status == "known_unauthorized"
                and .diagnostics.amfResponse.status == "0"
                and .diagnostics.amfResponse.message == "401"
                and .diagnostics.httpStatus == 200
                and "'"$HTTP_STATUS"'" == "200"
              ' <<< "$RESPONSE" >/dev/null
              echo "::notice title=AMF Preview Validation::AMF: known authorization pending (external, tracked separately)."
              echo "AMF: known authorization pending (external, tracked separately)."
              ;;
            failure|*)
              MESSAGE="$(jq -r '.error // .message // "Unknown AMF probe failure."' <<< "$RESPONSE")"
              echo "::error title=AMF Preview Validation::AMF genuine failure: $MESSAGE"
              exit 1
              ;;
          esac
