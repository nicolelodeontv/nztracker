name: Production API diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query production API
        shell: bash
        run: |
          set -euo pipefail

          sync="$(curl -fsSL --max-time 20 'https://nztracker.vercel.app/api/sync-status')"
          members="$(curl -fsSL --max-time 20 'https://nztracker.vercel.app/api/clan-members?clanId=3')"

          echo '--- sync-status ---'
          echo "$sync" | jq '{error, memberSources, lastRunAt, stale, ageMs, donations}'

          echo '--- clan-members ---'
          echo "$members" | jq '{error, details, source, service, count, stale, fetchedAt, firstTwoMembers: (.members // [] | .[0:2] | map({id,name,level,reputation,reputationGain,stamina,maxStamina,donatedGold,donatedToken}))}'
