name: Production API diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query production API
        shell: bash
        run: |
          set -u

          echo '--- sync-status ---'
          curl -sS -L --max-time 20 -w '\nHTTP:%{http_code}\n' 'https://nztracker.vercel.app/api/sync-status'

          echo '--- clan-members ---'
          curl -sS -L --max-time 20 -w '\nHTTP:%{http_code}\n' 'https://nztracker.vercel.app/api/clan-members?clanId=3'
