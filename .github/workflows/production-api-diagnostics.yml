name: Production API diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect legacy member response
        shell: bash
        run: |
          set -u
          html="$(curl -sS -L --max-time 20 'https://ninjazenshin.online/clan-ranking/members/3')"
          echo '--- RESPONSE BODY ---'
          printf '%s\n' "$html" | cut -c1-5000
