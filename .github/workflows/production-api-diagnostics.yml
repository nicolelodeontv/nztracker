name: Production API diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check current Chaos roster metadata
        shell: bash
        run: |
          set -u
          curl -sS -L --max-time 20 'https://nztracker.vercel.app/api/clans?limit=500' |
            jq '.clans[] | select((.clanId|tostring)=="3") | {clanId,clan,members,memberCount,expectedMemberCount,capturedAt,season,seasonEndsAt}' | head -c 5000
