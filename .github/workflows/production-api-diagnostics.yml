name: Production API diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare tracker hostnames
        shell: bash
        run: |
          set -u
          for host in nztracker.vercel.app chaoszenshintracker.vercel.app; do
            echo "--- $host /api/clan-members ---"
            curl -sS -L --max-time 20 "https://$host/api/clan-members?clanId=3" |
              jq '{count,source,service,stale,firstTwoMembers:(.members // [] | .[0:2] | map({id,name,level,reputation}))}'
            echo "--- $host /api/sync-status ---"
            curl -sS -L --max-time 20 "https://$host/api/sync-status" |
              jq '{ok,status,error,lastRunAt,memberSources}'
          done
