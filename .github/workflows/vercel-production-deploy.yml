name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_rx6g4OQD04E4zewjHyifD7xh
      VERCEL_PROJECT_ID: prj_QLVtFPim28aj0XbOQEkCD0I8tAHn
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Vercel Production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Production smoke test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is required for production monitor-health smoke testing." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 https://chaoszenshintracker.vercel.app/api/sync-status > sync-status.json
          curl --fail --silent --show-error --max-time 30 https://chaoszenshintracker.vercel.app/api/health > health.json
          curl --fail --silent --show-error --max-time 30 https://chaoszenshintracker.vercel.app/api/dashboard > dashboard.json
          curl --fail --silent --show-error --max-time 15 https://chaoszenshintracker.vercel.app/api/live > live.json
          curl --fail --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://chaoszenshintracker.vercel.app/api/monitor-health > monitor-health.json
          jq -e '
            .status == "active"
            and (.overall == "success")
            and (.intervalMs == 10000)
            and ((.membersSeen // 0) > 0)
            and ((.rankingRows // 0) > 0)
          ' sync-status.json > /dev/null
          jq -e '
            .ok == true
            and .services.memberHistory.durable == true
            and .services.rankingCache.status == "ready"
            and .services.syncStatus.status == "ready"
          ' health.json > /dev/null
          jq -e '.ok == true and .configured == true and (.rows | length) > 0' dashboard.json > /dev/null
          jq -e '.ok == true and .configured == true and (.rows | length) > 0 and (.syncStatus.intervalMs // 0) == 10000' live.json > /dev/null
          jq -e '.ok == true and .healthy == true and (.problems | length) == 0' monitor-health.json > /dev/null
          echo "production smoke test passed"
