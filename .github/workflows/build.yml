name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Inspect live legacy member payload
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://ninjazenshin.online/clan-ranking/members/3?t=' + Date.now();
          const response = await fetch(url, {
            cache: 'no-store',
            headers: {
              Accept: 'text/html,application/json,text/plain,*/*',
              'User-Agent': 'Mozilla/5.0 NinjaZenshinRawPayloadProbe/3.1',
            },
          });
          console.log('LEGACY URL:', url);
          console.log('HTTP:', response.status, response.statusText);
          console.log('Content-Type:', response.headers.get('content-type'));
          const body = await response.text();
          console.log('Response chars:', body.length);
          console.log('FULL RAW LEGACY RESPONSE:');
          console.log(body);
          NODE

      - name: Inspect live AMF member payload
        run: |
          node --input-type=module <<'NODE'
          import { buildMemberRequest, parseMemberResponse, AMF_ORIGIN, SERVICE, RESPONSE_TARGET } from './app/lib/ninja-source.mjs';
          const response = await fetch(AMF_ORIGIN, {
            method: 'POST',
            body: buildMemberRequest('3'),
            headers: {
              Accept: '*/*',
              'Cache-Control': 'no-cache',
              'Content-Type': 'application/x-amf',
              Origin: 'https://ninjazenshin.online',
              Pragma: 'no-cache',
              Referer: 'https://ninjazenshin.online/?panel=clan-ranking',
              'User-Agent': 'NinjaZenshinRawPayloadProbe/3.0',
            },
          });
          console.log('AMF_ORIGIN:', AMF_ORIGIN);
          console.log('SERVICE:', SERVICE);
          console.log('RESPONSE_TARGET:', RESPONSE_TARGET);
          console.log('HTTP:', response.status, response.statusText);
          const bytes = new Uint8Array(await response.arrayBuffer());
          console.log('Response bytes:', bytes.length);
          if (!response.ok) throw new Error('AMF request failed with HTTP ' + response.status);
          const data = parseMemberResponse(bytes);
          console.log('Top-level fields:', Object.keys(data || {}));
          const members = Array.isArray(data?.result) ? data.result : Array.isArray(data?.members) ? data.members : [];
          console.log('Raw member count:', members.length);
          if (!members.length) {
            console.log('FULL DECODED RESPONSE:');
            console.log(JSON.stringify(data, null, 2));
            process.exit(0);
          }
          console.log('Raw member field names:', Object.keys(members[0]));
          console.log('FULL RAW MEMBER RECORD:');
          console.log(JSON.stringify(members[0], null, 2));
          console.log('Field names across first 5:', [...new Set(members.slice(0, 5).flatMap(m => Object.keys(m || {})))]);
          NODE

      - name: Production build
        run: npm run build
