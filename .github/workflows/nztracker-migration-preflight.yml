name: NZTracker migration preflight (temporary)

on:
  push:
    branches:
      - ops/nztracker-migration-dry-run

permissions:
  contents: read

jobs:
  migration-preflight:
    name: Read migration ledger and dry-run only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.NZTRACKER_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.NZTRACKER_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: duhorigpqixteoaojsot
    steps:
      - name: Checkout PR snapshot
        uses: actions/checkout@v7
        with:
          ref: 6a2a43855a314711e1dbca55f1a05e82db00ee99
          persist-credentials: false

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" || -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "::error::Add repository Actions secrets NZTRACKER_SUPABASE_ACCESS_TOKEN and NZTRACKER_SUPABASE_DB_PASSWORD, then re-run this workflow."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@2.121.0

      - name: Initialize temporary local CLI config
        run: |
          set -euo pipefail
          if [[ ! -f supabase/config.toml ]]; then
            supabase init --yes
          fi

      - name: Link only the supplied candidate project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Read local and remote migration ledgers
        run: supabase migration list --linked

      - name: Read existing user-table names
        run: >-
          supabase db query --linked
          "SELECT table_schema, table_name
           FROM information_schema.tables
           WHERE table_type = 'BASE TABLE'
             AND table_schema NOT IN
               ('pg_catalog', 'information_schema', 'auth', 'storage',
                'extensions', 'graphql', 'graphql_public')
           ORDER BY table_schema, table_name;"

      - name: Preview pending migrations without applying them
        run: supabase db push --dry-run --linked
