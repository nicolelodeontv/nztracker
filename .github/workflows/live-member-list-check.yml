name: Live member-list check
on:
  push:
    branches: [tmp/live-member-list-check-20260921]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node check-member-list-live.mjs 3
