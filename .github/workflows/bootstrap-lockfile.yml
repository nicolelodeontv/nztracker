name: Bootstrap npm lockfile
# Temporary branch-only bootstrap; removed after package-lock.json is committed.

on:
  push:
    branches:
      - reliability/sync-3-0-20260922

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "npm did not generate package-lock.json" >&2
            exit 1
          fi
          if git status --short -- package-lock.json | grep -q '^'; then
            echo "package-lock.json needs to be committed"
          else
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm lockfile"
          git push
